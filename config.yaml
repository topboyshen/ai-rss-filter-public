# Runtime parameters. High-churn rule tables live under config/rules/ and
# are merged in listed order; keys in this file override every include.
include:
  - config/rules/feeds.yaml
  - config/rules/fast_pass.yaml
  - config/rules/filters.yaml
  - config/rules/themes.yaml
  - config/rules/prompts.yaml

cache_rejected_entries: true
cache_ttl: 1800
# Example private evidence cohort; no raw samples are included in this repository.
# Capture is bounded and never uploads or labels source/model text automatically.
score_evidence_capture:
  enabled: true
  directory: /app/data/score_evidence/example-cohort
  max_records: 500
  max_record_bytes: 262144
# Replayable evidence for the first rejected attempt of a scoring stage (article
# title and source text up to 20000 characters, the rejected raw model output and
# parsed tuple, 7-day append-only table). OFF by default; independent of the
# legacy capture directory above. Raising limits above the approved ceilings is
# not possible; see docs/first-rejection-retention.md.
first_rejection_retention:
  enabled: false
irrelevance_policy:
  default_floor: 4.0
briefing:
  default_hours: 24
briefing_assembly:
  enabled: true
  candidate_multiplier: 4
  max_themes: 4
  max_articles_per_theme: 3
  max_share_ratio: 0.4
  reserved_non_head_slots: 1
  grounding:
    enabled: true
    min_distinct_hits: 2
    require_strong_hit: true
    validate_direction: true
    on_fail: deterministic_fallback
generate_summary: true
llm:
- api_key: ${KIMI_CODE_API_KEY}
  base_url: https://api.kimi.com/coding/v1
  model: kimi-for-coding
  name: kimi-code
  priority: 1
  rate_limit: 1.0
  max_wait_seconds: 20
  timeout: 45
  max_fail_count: 8
  fail_decay_seconds: 300
  supports_max_tokens: true
  fixed_temperature: 0.6
  max_output_tokens: 200
  thinking: disabled
- api_key: ${LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen2.5-7B-Instruct
  name: siliconflow-qwen
  priority: 9
  rate_limit: 2.0
  max_wait_seconds: 8
  timeout: 30
  max_fail_count: 3
  fail_decay_seconds: 300
  # SiliconFlow 的兼容端点稳定支持 json_object。避免先发送会得到 HTTP 成功、
  # 却无法可靠约束该 Qwen 模型语义输出的 json_schema 请求。
  structured_output_mode: json_object
  # 免费 7B 指令跟随弱，用短输出契约；修复时只复制固定安全中性 JSON。
  compact_score_contract: true
  min_output_tokens: 160
llm_routing:
  # 一级筛选按 Kimi -> Qwen 逐级回退；两者都失败后使用确定性本地规则。
  stage1:
  - kimi-code
  - siliconflow-qwen
  # 仅边界/高价值新闻进入 Kimi K2.6 非思考复核，失败回退 Qwen。
  stage2:
  - kimi-code
  - siliconflow-qwen
  summary:
  - kimi-code
  - siliconflow-qwen
  # 长输出任务不走 128-token 的 Kimi 短任务通道。
  digest:
  - siliconflow-qwen
  default:
  - siliconflow-qwen
llm_semantic_repair:
  # HTTP 成功但严格解析/grounding 拒绝时，仅在当前后端追加一次固定指令重试。
  enabled: true
llm_score_cache:
  enabled: true
  ttl_seconds: 3600
llm_pricing:
  kimi-for-coding:
    input_per_million: 0
    output_per_million: 0
  Qwen/Qwen2.5-7B-Instruct:
    input_per_million: 0
    output_per_million: 0
cost_control:
  daily_budget: 0
  warn_threshold: 0.8
scoring_strategy_version: 2026-05-19-v2
local_fast_reject_max_rule_score: 4
max_entries: 10
max_workers: 2
multi_max_workers: 3
output:
  max_items: 10
quiet_mode:
  enabled: true
  notify_threshold_raise: 1.0
  schedule:
  - start: 00:00
    end: 08:30
    label: 深夜/盘前强静默
    notify_threshold_raise: 1.0
  - start: 08:30
    end: 09:15
    label: 盘前弱静默
    notify_threshold_raise: 0.3
  - start: '11:30'
    end: '13:00'
    label: 午休
    notify_threshold_raise: 0.5
  - start: '15:00'
    end: 09:15
    label: 闭市
    notify_threshold_raise: 1.0
rss_timeout: 20
security:
  allow_query_api_key: false
  api_key: ''
  cors_allowed_origins:
  - http://127.0.0.1:9998
  - http://localhost:9998
  - https://example.invalid
  - https://ai.example.invalid
similarity_window_hours: 72
staleness_warn_seconds: 14400
few_shot_feedback:
  enabled: false
  positive_examples: 3
  negative_examples: 3
  stage2_only: true
two_stage_scoring:
  enabled: true
  stage2_min_score: 6.5
  stage2_max_score: 8.5
  high_value_source_tiers:
  - primary_news
  - official
  - analysis
  stage2_on_fast_pass_hint: true
  stage2_on_similar_higher_score: true
summary_min_score: 7.0
telegram:
  bot_token: ''
  chat_id: ''
  enabled: false
threshold:
  notify: 9
  pass: 5.5
  similarity: 0.6
time_weight:
  enabled: false
  rules:
  - bonus: 0.5
    end_hour: 10
    label: 早盘黄金
    start_hour: 9
  - bonus: -0.3
    end_hour: 13
    label: 午休降权
    start_hour: 11
  - bonus: 0.2
    end_hour: 15
    label: 盘尾异动
    start_hour: 14
  - bonus: -0.5
    end_hour: 24
    label: 闭市休眠
    start_hour: 15
  - bonus: -0.5
    end_hour: 9
    label: 盘前准备
    start_hour: 0
