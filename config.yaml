llm:
- api_key: ${KIMI_CODE_API_KEY}
  base_url: https://api.kimi.com/coding/v1
  model: kimi-for-coding
  name: kimi-code
  priority: 1
  rate_limit: 1.0
  max_wait_seconds: 20
  timeout: 45
  max_fail_count: 8
  fail_decay_seconds: 300
  supports_max_tokens: true
  fixed_temperature: 0.6
  max_output_tokens: 200
  thinking: disabled
- api_key: ${LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1
  model: Qwen/Qwen2.5-7B-Instruct
  name: siliconflow-qwen
  priority: 9
  rate_limit: 2.0
  max_wait_seconds: 8
  timeout: 12
  max_fail_count: 3
  fail_decay_seconds: 300
  # SiliconFlow 的兼容端点稳定支持 json_object。避免先发送会得到 HTTP 成功、
  # 却无法可靠约束该 Qwen 模型语义输出的 json_schema 请求。
  structured_output_mode: json_object
  # 免费 7B 指令跟随弱，用短输出契约；修复时只复制固定安全中性 JSON。
  compact_score_contract: true
  min_output_tokens: 160
llm_routing:
  # 一级筛选按 Kimi -> Qwen 逐级回退；两者都失败后使用确定性本地规则。
  stage1:
  - kimi-code
  - siliconflow-qwen
  # 仅边界/高价值新闻进入 Kimi K2.6 非思考复核，失败回退 Qwen。
  stage2:
  - kimi-code
  - siliconflow-qwen
  summary:
  - kimi-code
  - siliconflow-qwen
  # 长输出任务不走 128-token 的 Kimi 短任务通道。
  digest:
  - siliconflow-qwen
  default:
  - siliconflow-qwen
llm_semantic_repair:
  # HTTP 成功但严格解析/grounding 拒绝时，仅在当前后端追加一次固定指令重试。
  enabled: true
llm_score_cache:
  enabled: true
  ttl_seconds: 3600
llm_pricing:
  kimi-for-coding:
    input_per_million: 0
    output_per_million: 0
  Qwen/Qwen2.5-7B-Instruct:
    input_per_million: 0
    output_per_million: 0
