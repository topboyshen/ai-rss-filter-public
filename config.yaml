# Example private evidence cohort; no raw samples are included in this repository.
# Capture is bounded and never uploads or labels source/model text automatically.
score_evidence_capture:
  enabled: true
  directory: /app/data/score_evidence/example-cohort
  max_records: 500
  max_record_bytes: 262144
# Replayable evidence for the first rejected attempt of a scoring stage (article
# title and source text up to 20000 characters, the rejected raw model output and
# parsed tuple, 7-day append-only table). OFF by default; independent of the
# legacy capture directory above. Raising limits above the approved ceilings is
# not possible; see docs/first-rejection-retention.md.
first_rejection_retention:
  enabled: false
