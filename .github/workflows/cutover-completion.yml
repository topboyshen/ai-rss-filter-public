      - '.github/workflows/cutover-completion.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-host-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fixed host-entry diagnostic dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-ops.txt
      - name: Independent isolated host loopback proof
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/isolated-host-ingress"
          python -I -B - <<'PY'
          import importlib.util, os, pathlib
          spec = importlib.util.spec_from_file_location('host_entry_archive', 'scripts/verify_production_startup_native.py')
          archive = importlib.util.module_from_spec(spec); spec.loader.exec_module(archive)
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'isolated-host-ingress' / 'FIXED_IMAGE_PULL'
          archive.archive_command(['/usr/bin/docker', '--host', 'unix:///var/run/docker.sock', 'pull',
              '--platform=linux/amd64',
              'nginx:stable-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1'],
              output, seconds=60, limit=128 * 1024, child_umask=0o077)
          PY
          source_sha="$(git rev-parse HEAD)"
          native_stage="$(sudo -n mktemp -d /tmp/ai-filter-host-ingress.XXXXXX)"
          sudo -n install -d -m 0700 "$native_stage/source"
          sudo -n git -c "safe.directory=$GITHUB_WORKSPACE" clone --no-local --no-hardlinks \
            "$GITHUB_WORKSPACE" "$native_stage/source"
          sudo -n test "$(sudo -n git -C "$native_stage/source" rev-parse HEAD)" = "$source_sha"
          export AI_FILTER_HOST_INGRESS_STAGE="$native_stage"
          python -I -B - <<'PY'
          import importlib.util, json, os, pathlib, sys, time
          spec = importlib.util.spec_from_file_location('host_entry_archive', 'scripts/verify_production_startup_native.py')
          archive = importlib.util.module_from_spec(spec); spec.loader.exec_module(archive)
          root = pathlib.Path(os.environ['AI_FILTER_HOST_INGRESS_STAGE'])
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'isolated-host-ingress' / 'HOST_INGRESS_PROCESS'
          deadline = time.monotonic() + 180
          args = ['/usr/bin/sudo', '-n', '--', sys.executable, '-I', '-B',
                  str(root / 'source/scripts/production_host_ingress_native.py'),
                  '--repo', str(root / 'source'), '--output', str(root / 'originals'),
                  '--deadline-monotonic', str(deadline)]
          archive.archive_command(args, output, seconds=200, limit=512 * 1024, child_umask=0o077)
          result = json.loads(pathlib.Path(str(output) + '.stdout').read_bytes())
          assert result['status'] == 'passed' and result['safe_evidence']['complete'] is True
          assert result['scope'] == 'independent_synthetic_host_namespace_only'
          assert result['full_activation_verified'] is False and result['runner_global_loopback_verified'] is False
          print('isolated_host_ingress_summary=' + json.dumps(result, sort_keys=True), flush=True)
          PY
      - name: Prepare independent safe host-entry evidence
        if: always()
        run: |
          python -I -B scripts/prepare_synthetic_evidence.py \
            --source "isolated-host-ingress=${RUNNER_TEMP}/isolated-host-ingress" \
            --output "${RUNNER_TEMP}/isolated-host-ingress-upload"
      - name: Preserve independent host-entry evidence including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-host-ingress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/isolated-host-ingress-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  native-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: synthetic_outbox
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_outbox"
          --health-interval 5s --health-timeout 3s --health-retries 10
          --memory 384m --memory-swap 384m --cpus 1 --pids-limit 64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache: false
      - name: Fixed host controller and real PostgreSQL driver dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-ops.txt
      - name: Real synthetic storage and frozen lifecycle at 768 MiB / 256 PID
        run: |
          python -I -B scripts/verify_cutover_completion_native.py \
            --repo . --output "${RUNNER_TEMP}/cutover-completion"
      - name: Actual application image migration and closed multiworker startup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/production-startup-source"
          git clone --depth 1 --branch 2.3.2 https://github.com/miniflux/v2.git "$RUNNER_TEMP/startup-miniflux"
          python -B scripts/apply_miniflux_pause.py --source "$RUNNER_TEMP/startup-miniflux" --apply \
            | tee "$RUNNER_TEMP/production-startup-source/APPLY.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'startup-synthetic-dsn.json'
          with path.open('x') as handle:
              json.dump({'dsn':'postgres://postgres:synthetic-ci-only@127.0.0.1:5432/synthetic_outbox?sslmode=disable'}, handle)
          path.chmod(0o600)
          PY
          python -I -B scripts/verify_production_startup_native.py \
            --repo . --output "${RUNNER_TEMP}/production-startup" \
            --postgres-dsn-file "${RUNNER_TEMP}/startup-synthetic-dsn.json" \
            --miniflux-source "${RUNNER_TEMP}/startup-miniflux"
      - name: Build fixed sender and verify actual T0 activation
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/production-startup-source/production-activation-build"
          source_sha="$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/startup-miniflux"
          { go version; set -x; CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -p 1 -trimpath \
            -ldflags "-X miniflux.app/v2/internal/version.Version=2.3.2 -X miniflux.app/v2/internal/version.Commit=${source_sha}" \
            -o "$RUNNER_TEMP/production-startup-source/production-activation-build/miniflux" .; } \
            2>&1 | tee "$RUNNER_TEMP/production-startup-source/production-activation-build/BUILD.log"
          chmod 0755 "$RUNNER_TEMP/production-startup-source/production-activation-build/miniflux"
          cd "$GITHUB_WORKSPACE"
          docker --host unix:///var/run/docker.sock build --platform=linux/amd64 --pull=false \
            --label "org.opencontainers.image.revision=${source_sha}" \
            -f ops/miniflux/Dockerfile -t "miniflux-activation-isolation:${GITHUB_SHA}" \
            "$RUNNER_TEMP/production-startup-source/production-activation-build" \
            2>&1 | tee "$RUNNER_TEMP/production-startup-source/production-activation-build/IMAGE_BUILD.log"
          docker --host unix:///var/run/docker.sock image inspect "miniflux-activation-isolation:${GITHUB_SHA}" \
            > "$RUNNER_TEMP/production-startup-source/production-activation-build/IMAGE.json"
          docker --host unix:///var/run/docker.sock pull --platform=linux/amd64 \
            redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          docker --host unix:///var/run/docker.sock pull --platform=linux/amd64 \
            nginx:stable-alpine@sha256:0d3b80406a13a767339fbe2f41406d6c7da727ab89cf8fae399e81f780f814d1
          image_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))[0]["Id"])' "$RUNNER_TEMP/production-startup-source/production-activation-build/IMAGE.json")"
          native_stage="$(sudo -n mktemp -d /tmp/ai-filter-bootstrap-native.XXXXXX)"
          # These are new private synthetic copies. Do not change checkout
          # ownership, trust a broad safe.directory, or alter the system cron.
          sudo -n git -c "safe.directory=$GITHUB_WORKSPACE" clone --no-local --no-hardlinks \
            "$GITHUB_WORKSPACE" "$native_stage/source"
          sudo -n test "$(sudo -n git -C "$native_stage/source" rev-parse HEAD)" = "$source_sha"
          sudo -n cp -a --no-preserve=ownership -- "$RUNNER_TEMP/startup-miniflux" "$native_stage/miniflux"
          sudo -n install -d -m 0700 "$native_stage/build"
          sudo -n install -m 0400 "$RUNNER_TEMP/production-startup-source/production-activation-build/BUILD.log" "$native_stage/build/BUILD.log"
          sudo -n install -m 0400 "$RUNNER_TEMP/production-startup-source/production-activation-build/IMAGE_BUILD.log" "$native_stage/build/IMAGE_BUILD.log"
          sudo -n install -m 0400 "$RUNNER_TEMP/production-startup-source/production-activation-build/IMAGE.json" "$native_stage/build/rawimage.json"
          sudo -n install -m 0500 "$RUNNER_TEMP/production-startup-source/production-activation-build/miniflux" "$native_stage/miniflux-binary"
          export AI_FILTER_NATIVE_BOOTSTRAP_STAGE="$native_stage" AI_FILTER_NATIVE_BOOTSTRAP_IMAGE="$image_id"
          python -I -B - <<'PY'
          import importlib.util, json, os, pathlib, sys
          spec = importlib.util.spec_from_file_location('startup_archive', 'scripts/verify_production_startup_native.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          root = pathlib.Path(os.environ['AI_FILTER_NATIVE_BOOTSTRAP_STAGE'])
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'production-startup-source' / 'BOOTSTRAP_PROCESS'
          args = ['/usr/bin/sudo', '-n', '--', sys.executable, '-I', '-B',
                  str(root / 'source/scripts/production_sender_bootstrap_native.py'),
                  '--repo', str(root / 'source'), '--source', str(root / 'miniflux'),
                  '--binary', str(root / 'miniflux-binary'), '--image-id', os.environ['AI_FILTER_NATIVE_BOOTSTRAP_IMAGE'],
                  '--build-evidence', str(root / 'build'), '--output', str(root / 'originals')]
          module.archive_command(args, output, seconds=240, limit=512 * 1024, child_umask=0o077)
          result = json.loads(pathlib.Path(str(output) + '.stdout').read_bytes())
          assert result['status'] == 'passed' and result['safe_evidence']['complete'] is True
          PY
          python -I -B - <<'PY'
          import importlib.util, json, os, pathlib, sys
          spec = importlib.util.spec_from_file_location('activation_archive', 'scripts/verify_production_startup_native.py')
          archive = importlib.util.module_from_spec(spec); spec.loader.exec_module(archive)
          root = pathlib.Path(os.environ['AI_FILTER_NATIVE_BOOTSTRAP_STAGE'])
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'production-startup-source' / 'ACTIVATION_HOST_PROCESS'
          args = ['/usr/bin/sudo', '-n', '--', sys.executable, '-I', '-B',
                  str(root / 'source/scripts/production_activation_host_native.py'),
                  '--repo', str(root / 'source'), '--source', str(root / 'miniflux'),
                  '--binary', str(root / 'miniflux-binary'), '--image-id', os.environ['AI_FILTER_NATIVE_BOOTSTRAP_IMAGE'],
                  '--output', str(root / 'activation-originals')]
          archive.archive_command(args, output, seconds=600, limit=512 * 1024, child_umask=0o077)
          result = json.loads(pathlib.Path(str(output) + '.stdout').read_bytes())
          assert result['status'] == 'passed' and result['safe_evidence']['complete'] is True
          assert result['full_activation_verified'] is True
          PY
      - name: Preserve actual synthetic PostgreSQL state on success or failure
        if: always()
        env:
          PG_ID: '${{ job.services.postgres.id }}'
        run: |
          set -uo pipefail
          umask 077
          evidence="$RUNNER_TEMP/production-startup-postgres"
          mkdir -p "$evidence"
          [[ "$PG_ID" =~ ^[0-9a-f]{64}$ ]] || exit 2
          failed=0
          preserve() {
            local name="$1" rc=0
            shift
            timeout --signal=TERM --kill-after=5s 30s "$@" > "$evidence/$name" 2> "$evidence/$name.stderr" || rc=$?
            printf '%s\n' "$rc" > "$evidence/$name.exit_code"
            if [ "$rc" -ne 0 ]; then failed=1; fi
          }
          preserve PG_INSPECT.json docker --host unix:///var/run/docker.sock inspect "$PG_ID" --format '{{json .}}'
          preserve PG_MEMORY_PEAK.txt docker --host unix:///var/run/docker.sock exec "$PG_ID" cat /sys/fs/cgroup/memory.peak
          preserve PG_MEMORY_EVENTS.txt docker --host unix:///var/run/docker.sock exec "$PG_ID" cat /sys/fs/cgroup/memory.events
          preserve SYNTHETIC_DATABASE.sql docker --host unix:///var/run/docker.sock exec "$PG_ID" pg_dump -U postgres -d synthetic_outbox
          exit "$failed"
      - name: Prepare evidence without following fixture links
        if: always()
        run: |
          python -I -B scripts/prepare_synthetic_evidence.py \
            --source "cutover-completion=${RUNNER_TEMP}/cutover-completion" \
            --source "production-startup=${RUNNER_TEMP}/production-startup" \
            --source "production-startup-postgres=${RUNNER_TEMP}/production-startup-postgres" \
            --source "production-startup-source=${RUNNER_TEMP}/production-startup-source" \
            --output "${RUNNER_TEMP}/cutover-safe-upload"

      - name: Preserve bounded prepared priority diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutover-priority-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cutover-safe-upload/PRIORITY_DIAGNOSTICS.json
            ${{ runner.temp }}/cutover-safe-upload/files/production-startup-source/BOOTSTRAP_PROCESS.stdout
            ${{ runner.temp }}/cutover-safe-upload/files/production-startup-source/BOOTSTRAP_PROCESS.stderr
            ${{ runner.temp }}/cutover-safe-upload/files/production-startup-source/ACTIVATION_HOST_PROCESS.stdout
            ${{ runner.temp }}/cutover-safe-upload/files/production-startup-source/ACTIVATION_HOST_PROCESS.stderr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Preserve original evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cutover-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cutover-safe-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
